[project]
name = "yxwoof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pgvector>=0.4,<1",
 "httpx>=0.28,<1", "langgraph>=1,<2", "pydantic>=2.10,<3",
 "jieba>=0.42,<1", "rank-bm25>=0.2,<1",
 "pytest>=8,<9", "pytest-asyncio>=0.25,<1"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
